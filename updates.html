<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>נרשמת לעדכונים | BOOST ME</title>
<meta name="theme-color" content="#2B1A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--plum:#2B1A2E;--paper:#FFF8F0;--ink:#2B1A2E;--ink-soft:#5E4A5F;--magenta-deep:#B30C6E;--orange-ink:#8A4300;--on-plum-soft:#E3CFDD;--wa:#12823F;--wa-deep:#0E6A33}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--plum);color:var(--ink);font:17px/1.6 "Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,6vw,64px) clamp(16px,4vw,48px)}
  .sheet{background:var(--paper);max-width:560px;width:100%;margin:0 auto;border-radius:6px 6px 18px 18px;padding:clamp(28px,5vw,44px);box-shadow:0 30px 60px -24px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.4);transform:rotate(-0.6deg);position:relative}
  .stamp{display:inline-block;border:2px solid var(--orange-ink);color:var(--orange-ink);font-weight:900;font-size:.95rem;padding:4px 12px;border-radius:6px;transform:rotate(-6deg);margin-bottom:18px}
  h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:900;line-height:1.1;margin:0 0 14px;padding-bottom:12px;border-bottom:2px solid var(--ink);text-wrap:balance}
  p{margin:0 0 14px}
  .soft{color:var(--ink-soft)}
  a{color:var(--magenta-deep);font-weight:700}
  a:focus-visible{outline:3px solid var(--magenta-deep);outline-offset:3px;border-radius:5px}
  footer{color:var(--on-plum-soft);text-align:center;font-size:.85rem;margin-top:28px}
  @media (max-width:920px){.sheet{transform:none}}
  @media (max-width:560px){body{font-size:16px}}
</style>
</head>
<body>
<main class="sheet">
  <span class="stamp">בפנים</span>
  <h1>מעולה, נרשמת לעדכונים.</h1>
  <p>כשתהיה הדרכה חדשה, תקבלו ממני מייל עם הפרטים והקישור להרשמה. בלי הצפות, רק כשיש משהו ששווה לבוא אליו.</p>
  <p class="soft">בינתיים, ההדרכות הקודמות מחכות ב<a href="https://www.youtube.com/@AI_and_Tools">ערוץ היוטיוב של AI &amp; Tools</a>.</p>
  <p class="soft">רוצים לצאת? בכל מייל יש קישור להסרה מהרשימה.</p>
</main>
<footer>BOOST ME · GEMS Digital Projects</footer>
</body>
</html>
